<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <!-- Glowing Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Lightning / Wave Accent -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.4" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Monitor Display Body -->
  <rect x="10" y="11" width="44" height="30" rx="4" fill="#030712" stroke="#1e293b" stroke-width="1.5" />

  <!-- Screen Content Area (Glowing gradient) -->
  <rect x="12" y="13" width="40" height="26" rx="2.5" fill="url(#screenGrad)" fill-opacity="0.15" />

  <!-- Cast Waves (Top Right) -->
  <path d="M 44 18 A 6 6 0 0 0 38 24" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 47 16 A 11 11 0 0 0 35 27" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6" />

  <!-- Lightning Bolt Mirror Icon (Center) -->
  <path d="M 34 16 L 24 28 L 30 28 L 26 38 L 39 25 L 32 25 Z" 
        fill="url(#boltGrad)" 
        filter="url(#glow)" />

  <!-- Monitor Stand -->
  <path d="M 28 41 L 28 47 L 36 47 L 36 41 Z" fill="#334155" />
  <rect x="20" y="47" width="24" height="3" rx="1.5" fill="#475569" stroke="#06b6d4" stroke-width="0.75" />

  <!-- Subtle Power LED -->
  <circle cx="32" cy="38.5" r="1" fill="#06b6d4" filter="url(#glow)" />
</svg>
